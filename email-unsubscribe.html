<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060d18">
  <title>إلغاء اشتراك تحديثات البريد | OPERIX</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,rgba(34,211,238,.1),transparent 28%),#060d18;color:#e2e8f0;font-family:Tahoma,Arial,sans-serif}.card{width:min(100%,520px);padding:28px;border:1px solid #26364b;border-radius:22px;background:#0d1726;box-shadow:0 24px 70px #0006}h1{margin:0 0 10px;font-size:22px;color:#f8fafc}p{font-size:13px;line-height:1.9;color:#94a3b8}.brand{margin-bottom:22px;color:#f5c96d;font-size:13px;font-weight:800;letter-spacing:2px}button,a{display:inline-block;border:0;border-radius:12px;padding:12px 18px;background:#22d3ee;color:#07111f;text-decoration:none;font:700 13px Tahoma,Arial,sans-serif;cursor:pointer}button:disabled{opacity:.5}.state{margin-top:16px;font-size:12px;color:#cbd5e1}.fine{margin-top:20px;border-top:1px solid #26364b;padding-top:14px;font-size:10px;color:#64748b}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">OPERIX · تفضيلات البريد</div>
    <h1>إلغاء رسائل تحديثات المنصة</h1>
    <p>يمكنك إيقاف رسائل التحديثات والإضافات الجديدة. ستستمر رسائل الأمان والمعاملات الضرورية المرتبطة بحسابك.</p>
    <button id="unsubscribeButton" type="button">إلغاء الاشتراك</button>
    <div id="unsubscribeStatus" class="state" role="status" aria-live="polite"></div>
    <div class="fine">لا تشارك رابط إلغاء الاشتراك؛ فهو مخصص لهذا الحساب فقط.</div>
  </main>
  <script>
    const button = document.getElementById('unsubscribeButton');
    const status = document.getElementById('unsubscribeStatus');
    const token = new URLSearchParams(location.search).get('token') || '';
    button.addEventListener('click', async () => {
      if (!token) { status.textContent = 'رابط إلغاء الاشتراك غير صالح.'; button.disabled = true; return; }
      button.disabled = true;
      status.textContent = 'جارٍ حفظ تفضيلك…';
      try {
        const response = await fetch('/api/email/unsubscribe', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'تعذر حفظ التفضيل.');
        status.textContent = data.message;
        button.textContent = 'تم إلغاء الاشتراك';
      } catch (error) {
        status.textContent = error.message || 'تعذر حفظ التفضيل. حاول لاحقًا.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
