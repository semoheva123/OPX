<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الصفحة غير موجودة | OPERIX</title><style>body{margin:0;background:#07111f;color:#e5e7eb;font-family:Arial;text-align:center;padding:18vh 20px}h1{font-size:5rem;color:#f7b955;margin:0}p{color:#94a3b8}a{color:#f7b955;text-decoration:none;border:1px solid #f7b955;padding:10px 18px;border-radius:10px}


/* ===== Safe scroll-driven motion layer for OPERIX ===== */
html{overflow-x:hidden}body{overflow-x:hidden;overscroll-behavior-x:none;perspective:1400px;transform-style:preserve-3d}.operix-3d-stage,.glass-card,.company-intro,.product-preview,.intro-feature,.about-panel,.opx-market-card,.auth-panel{transform-style:preserve-3d}.glass-card,.company-intro,.product-preview,.intro-feature,.about-panel,.opx-market-card{transform:translateZ(0)}body::before{content:'';position:fixed;inset:-12%;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at 70% 12%, rgba(247,185,85,0.16), transparent 18%),radial-gradient(circle at 15% 78%, rgba(69,214,176,0.14), transparent 12%),radial-gradient(circle at 60% 95%, rgba(34,211,238,0.12), transparent 20%);background-size:130% 130%;background-position:center center;transform:scale(1.08) translateZ(-80px);opacity:0.8}body::after{content:'';position:fixed;inset:-4%;z-index:-1;pointer-events:none;background-image:linear-gradient(115deg,transparent,rgba(247,185,85,0.08),transparent),repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(255,255,255,0.035) 9px);transform:scale(1.05) rotateX(8deg) translateZ(-120px);filter:blur(.2px);opacity:0.7}@supports (animation-timeline: scroll()){body::before{animation:operixParallaxFloat linear both;animation-timeline:scroll(root block);animation-range:0% 100%}body::after{animation:operixDepthDrift 1500ms ease-out both;animation-timeline:scroll(root block);animation-range:0% 100%}}@supports (animation-timeline: view()){.company-intro{animation:operixHeroScaleFade 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 85%}.product-preview{animation:operixPreviewScale 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 82%}.intro-reveal,.intro-feature,.about-panel,.glass-card,.opx-market-card{animation:operixRevealFadeUp 850ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 78%}.intro-feature{animation-delay:80ms}.about-panel{animation-delay:150ms}.opx-market-card{animation-delay:120ms}}@keyframes operixHeroScaleFade{from{opacity:0.78;transform:scale(0.985) perspective(1400px) rotateX(3deg)}to{opacity:1;transform:scale(1) perspective(1400px) rotateX(0)}}@keyframes operixPreviewScale{from{opacity:0;transform:translateY(16px) scale(0.96) perspective(1400px) rotateY(-8deg) rotateX(4deg);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1) perspective(1400px) rotateY(0deg) rotateX(0deg);filter:blur(0)}}@keyframes operixRevealFadeUp{from{opacity:0;transform:translateY(28px) scale(0.98) perspective(1400px) translateZ(-20px)}to{opacity:1;transform:translateY(0) scale(1) perspective(1400px) translateZ(0)}}@keyframes operixParallaxFloat{0%{transform:scale(1.08) translateY(-4%) translateZ(-60px);opacity:0.76}50%{transform:scale(1.12) translateY(2%) translateZ(-20px);opacity:0.9}100%{transform:scale(1.16) translateY(5%) translateZ(40px);opacity:0.98}}@keyframes operixDepthDrift{from{transform:translateY(-20px) scale(1.03) rotateX(8deg) translateZ(-140px);opacity:0.45}to{transform:translateY(16px) scale(1.07) rotateX(8deg) translateZ(20px);opacity:0.72}}@media (max-width: 640px){body{overflow-x:hidden}}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style><h1>404</h1><h2>الصفحة غير موجودة</h2><p>الرابط المطلوب غير متاح أو تم نقله.</p><a href="/">العودة إلى OPERIX</a></html>
