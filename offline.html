<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>بدون اتصال | OPERIX</title>
    <link rel="icon" type="image/svg+xml" href="/operix-icon.svg">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(1200px 600px at 50% -10%, #1c2a4a 0%, #0b1120 55%, #060a14 100%); color: #e2e8f0; font-family: "Tajawal", "Segoe UI", system-ui, -apple-system, sans-serif; }
        main { width: 100%; max-width: 460px; text-align: center; padding: 36px 28px; border-radius: 24px; border: 1px solid rgba(148, 163, 184, .22); background: rgba(15, 23, 42, .72); box-shadow: 0 24px 60px rgba(2, 6, 23, .55); }
        img { width: 64px; height: 64px; margin-bottom: 18px; }
        h1 { margin: 0 0 10px; font-size: 1.4rem; }
        p { margin: 0 0 22px; line-height: 1.9; color: #94a3b8; font-size: .95rem; }
        button { appearance: none; border: 0; cursor: pointer; width: 100%; padding: 13px 20px; border-radius: 14px; font-size: 1rem; font-weight: 700; font-family: inherit; color: #0b1120; background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 3px; }
        ul { text-align: right; color: #94a3b8; font-size: .85rem; line-height: 2; padding-inline-start: 18px; margin: 0 0 22px; }
    </style>
</head>
<body>
    <main>
        <img src="/operix-icon.svg" alt="OPERIX">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تعذّر الوصول إلى الخادم. الصفحات التي زرتها سابقًا ما زالت متاحة، لكن الأرصدة والعمليات تحتاج اتصالًا.</p>
        <ul>
            <li>تأكد من شبكة الواي فاي أو بيانات الهاتف.</li>
            <li>أعد المحاولة بعد لحظات.</li>
        </ul>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
</body>
</html>
