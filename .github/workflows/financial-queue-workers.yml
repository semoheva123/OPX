name: Financial queue workers

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/financial-queue-workers.yml'
      - 'server.js'
      - 'src/config/supabase.js'
      - 'src/services/financialReadinessService.js'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      auth_only:
        description: Verify Production auth, schema and wallet readiness without processing queues
        type: boolean
        required: false
        default: false

concurrency:
  group: financial-queue-workers
  cancel-in-progress: false

jobs:
  process-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        id: validate
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Add CRON_SECRET as a GitHub Actions repository secret before enabling this workflow."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Verify CRON_SECRET without processing queues
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.auth_only) }}
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --max-time 70 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/__auth_probe__')
          if [[ "$status" != "404" ]]; then
            echo "::error::Production did not accept CRON_SECRET (expected auth-probe HTTP 404; received ${status})."
            exit 1
          fi
          echo 'Production accepted CRON_SECRET (HTTP 404 auth probe); no queue worker was invoked.'
          health_file=$(mktemp)
          trap 'rm -f "$health_file"' EXIT
          curl --fail --silent --show-error --output "$health_file" --max-time 20 \
            'https://operix.website/api/health'
          jq -e '.success == true and .financialSchema.ready == true' "$health_file" > /dev/null
          echo 'Production database and financial migration tables are ready.'
          readiness_file=$(mktemp)
          trap 'rm -f "$health_file" "$readiness_file"' EXIT
          curl --fail --silent --show-error --output "$readiness_file" --max-time 40 \
            --retry 3 --retry-delay 8 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/check-financial-readiness'
          jq -c '{readyForControlledTest: .result.readyForControlledTest, checks: .result.checks, switches: .result.switches}' "$readiness_file"
          jq -e '.success == true and .result.readyForControlledTest == true' "$readiness_file" > /dev/null || {
            safe_checks=$(jq -c '{readyForControlledTest: .result.readyForControlledTest, checks: .result.checks, switches: .result.switches}' "$readiness_file")
            echo "::error title=Read-only financial preflight blocked::$safe_checks"
            echo 'No deposit or payout worker was invoked.'
            exit 1
          }

      - name: Validate financial schema before processing queues
        id: schema
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.auth_only) }}
        shell: bash
        run: |
          health_file=$(mktemp)
          trap 'rm -f "$health_file"' EXIT
          curl --fail --silent --show-error --output "$health_file" --max-time 20 \
            'https://operix.website/api/health'
          jq -e '.success == true and .financialSchema.ready == true' "$health_file" > /dev/null || {
            echo '::error::Production database or required deposit/payout migration tables are not ready; financial processors were not called.'
            exit 1
          }
          echo 'Production database and financial migration tables are ready.'

      - name: Process confirmed TRON deposits
        if: ${{ steps.schema.outcome == 'success' }}
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --output "$response_file" \
            --write-out 'TRON deposit worker HTTP %{http_code}\n' \
            --max-time 70 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/process-tron-deposits'
          jq -c '{success, job, processed: .result.processed, skipped: (.result.skipped // false), reason: (.result.reason // null)}' "$response_file"
          jq -e '.success == true and (.result.skipped != true)' "$response_file" > /dev/null

      - name: Process authorized withdrawal payouts
        if: ${{ always() && steps.validate.outputs.configured == 'true' && steps.schema.outcome == 'success' }}
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --output "$response_file" \
            --write-out 'Withdrawal payout worker HTTP %{http_code}\n' \
            --max-time 70 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/process-withdrawal-payouts'
          jq -c '{success, job, automaticApprovalsProcessed: (.result.automaticApprovals.processed // null), payoutsProcessed: (.result.payouts.processed // null), skipped: (.result.payouts.skipped // false), reason: (.result.payouts.reason // null)}' "$response_file"
          jq -e '.success == true and (.result.payouts.skipped != true) and ((.result.automaticApprovals.error // "") == "")' "$response_file" > /dev/null
