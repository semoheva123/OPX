name: Financial queue workers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: financial-queue-workers
  cancel-in-progress: false

jobs:
  process-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate scheduler configuration
        id: validate
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Add CRON_SECRET as a GitHub Actions repository secret before enabling this workflow."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Process confirmed TRON deposits
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --output "$response_file" \
            --write-out 'TRON deposit worker HTTP %{http_code}\n' \
            --max-time 70 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/process-tron-deposits'
          jq -c '{success, job, processed: .result.processed, skipped: (.result.skipped // false), reason: (.result.reason // null)}' "$response_file"
          jq -e '.success == true' "$response_file" > /dev/null

      - name: Process authorized withdrawal payouts
        if: ${{ always() && steps.validate.outputs.configured == 'true' }}
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --output "$response_file" \
            --write-out 'Withdrawal payout worker HTTP %{http_code}\n' \
            --max-time 70 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            'https://operix.website/api/internal/cron/process-withdrawal-payouts'
          jq -c '{success, job, automaticApprovalsProcessed: (.result.automaticApprovals.processed // null), payoutsProcessed: (.result.payouts.processed // null), skipped: (.result.payouts.skipped // false), reason: (.result.payouts.reason // null)}' "$response_file"
          jq -e '.success == true and ((.result.automaticApprovals.error // "") == "")' "$response_file" > /dev/null
