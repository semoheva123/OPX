<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إعداد دخول الإدارة | OPERIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>


/* ===== Safe scroll-driven motion layer for OPERIX ===== */
html{overflow-x:hidden}body{overflow-x:hidden;overscroll-behavior-x:none;perspective:1400px;transform-style:preserve-3d}.operix-3d-stage,.glass-card,.company-intro,.product-preview,.intro-feature,.about-panel,.opx-market-card,.auth-panel{transform-style:preserve-3d}.glass-card,.company-intro,.product-preview,.intro-feature,.about-panel,.opx-market-card{transform:translateZ(0)}body::before{content:'';position:fixed;inset:-12%;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at 70% 12%, rgba(247,185,85,0.16), transparent 18%),radial-gradient(circle at 15% 78%, rgba(69,214,176,0.14), transparent 12%),radial-gradient(circle at 60% 95%, rgba(34,211,238,0.12), transparent 20%);background-size:130% 130%;background-position:center center;transform:scale(1.08) translateZ(-80px);opacity:0.8}body::after{content:'';position:fixed;inset:-4%;z-index:-1;pointer-events:none;background-image:linear-gradient(115deg,transparent,rgba(247,185,85,0.08),transparent),repeating-linear-gradient(90deg,transparent,transparent 8px,rgba(255,255,255,0.035) 9px);transform:scale(1.05) rotateX(8deg) translateZ(-120px);filter:blur(.2px);opacity:0.7}@supports (animation-timeline: scroll()){body::before{animation:operixParallaxFloat linear both;animation-timeline:scroll(root block);animation-range:0% 100%}body::after{animation:operixDepthDrift 1500ms ease-out both;animation-timeline:scroll(root block);animation-range:0% 100%}}@supports (animation-timeline: view()){.company-intro{animation:operixHeroScaleFade 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 85%}.product-preview{animation:operixPreviewScale 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 82%}.intro-reveal,.intro-feature,.about-panel,.glass-card,.opx-market-card{animation:operixRevealFadeUp 850ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 78%}.intro-feature{animation-delay:80ms}.about-panel{animation-delay:150ms}.opx-market-card{animation-delay:120ms}}@keyframes operixHeroScaleFade{from{opacity:0.78;transform:scale(0.985) perspective(1400px) rotateX(3deg)}to{opacity:1;transform:scale(1) perspective(1400px) rotateX(0)}}@keyframes operixPreviewScale{from{opacity:0;transform:translateY(16px) scale(0.96) perspective(1400px) rotateY(-8deg) rotateX(4deg);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1) perspective(1400px) rotateY(0deg) rotateX(0deg);filter:blur(0)}}@keyframes operixRevealFadeUp{from{opacity:0;transform:translateY(28px) scale(0.98) perspective(1400px) translateZ(-20px)}to{opacity:1;transform:translateY(0) scale(1) perspective(1400px) translateZ(0)}}@keyframes operixParallaxFloat{0%{transform:scale(1.08) translateY(-4%) translateZ(-60px);opacity:0.76}50%{transform:scale(1.12) translateY(2%) translateZ(-20px);opacity:0.9}100%{transform:scale(1.16) translateY(5%) translateZ(40px);opacity:0.98}}@keyframes operixDepthDrift{from{transform:translateY(-20px) scale(1.03) rotateX(8deg) translateZ(-140px);opacity:0.45}to{transform:translateY(16px) scale(1.07) rotateX(8deg) translateZ(20px);opacity:0.72}}@media (max-width: 640px){body{overflow-x:hidden}}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
    <main class="w-full max-w-md rounded-3xl border border-cyan-500/20 bg-slate-900 p-6 shadow-2xl">
        <h1 class="text-xl font-black">إكمال إعداد دخول الإدارة</h1>
        <p class="mt-2 text-sm text-slate-400">أنشئ كلمة مرور للحساب الإداري المدعو.</p>
        <form id="setupForm" class="mt-6 space-y-4">
            <input id="password" type="password" minlength="8" required placeholder="كلمة المرور الجديدة" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm outline-none focus:border-cyan-400">
            <input id="confirmPassword" type="password" minlength="8" required placeholder="تأكيد كلمة المرور" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm outline-none focus:border-cyan-400">
            <button class="w-full rounded-xl bg-cyan-400 px-4 py-3 text-sm font-black text-slate-950">متابعة الإعداد</button>
            <div id="twoFactorStep" class="hidden space-y-3">
                <img id="qrCode" class="mx-auto h-44 w-44 rounded-xl bg-white p-2" alt="رمز إعداد المصادقة">
                <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="رمز المصادقة من 6 أرقام" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-center text-sm tracking-[0.4em] outline-none focus:border-cyan-400">
                <button id="confirmButton" type="button" class="w-full rounded-xl border border-emerald-400/30 bg-emerald-400/15 px-4 py-3 text-sm font-black text-emerald-300">تفعيل الحماية وتأكيد الدعوة</button>
            </div>
            <p id="message" class="text-sm text-slate-400" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById('setupForm');
        const message = document.getElementById('message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = new URLSearchParams(window.location.search).get('token') || '';
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!token) { message.innerText = 'رابط الدعوة غير مكتمل.'; return; }
            if (password !== confirmPassword) { message.innerText = 'كلمتا المرور غير متطابقتين.'; return; }
            const response = await fetch('/api/auth/admin-invite/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
            const data = await response.json();
            if (!response.ok) { message.innerText = data.error || 'تعذر إعداد الحساب.'; return; }
            document.getElementById('qrCode').src = data.qrCode;
            document.getElementById('twoFactorStep').classList.remove('hidden');
            message.innerText = data.message || 'امسح الرمز ثم أدخل رمز المصادقة.';
            form.querySelector('button').disabled = true;
        });
        document.getElementById('confirmButton').addEventListener('click', async () => {
            const token = new URLSearchParams(window.location.search).get('token') || '';
            const code = document.getElementById('code').value.trim();
            const response = await fetch('/api/auth/admin-invite/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, code }) });
            const data = await response.json();
            message.innerText = data.message || data.error || 'تعذر تأكيد الدعوة.';
            if (response.ok) document.getElementById('confirmButton').disabled = true;
        });
    </script>
</body>
</html>
