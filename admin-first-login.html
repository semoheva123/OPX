<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إعداد دخول الإدارة | OPERIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
    <main class="w-full max-w-md rounded-3xl border border-cyan-500/20 bg-slate-900 p-6 shadow-2xl">
        <h1 class="text-xl font-black">إكمال إعداد دخول الإدارة</h1>
        <p class="mt-2 text-sm text-slate-400">أنشئ كلمة مرور للحساب الإداري المدعو.</p>
        <form id="setupForm" class="mt-6 space-y-4">
            <input id="password" type="password" minlength="8" required placeholder="كلمة المرور الجديدة" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm outline-none focus:border-cyan-400">
            <input id="confirmPassword" type="password" minlength="8" required placeholder="تأكيد كلمة المرور" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-sm outline-none focus:border-cyan-400">
            <button class="w-full rounded-xl bg-cyan-400 px-4 py-3 text-sm font-black text-slate-950">متابعة الإعداد</button>
            <div id="twoFactorStep" class="hidden space-y-3">
                <img id="qrCode" class="mx-auto h-44 w-44 rounded-xl bg-white p-2" alt="رمز إعداد المصادقة">
                <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="رمز المصادقة من 6 أرقام" class="w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-3 text-center text-sm tracking-[0.4em] outline-none focus:border-cyan-400">
                <button id="confirmButton" type="button" class="w-full rounded-xl border border-emerald-400/30 bg-emerald-400/15 px-4 py-3 text-sm font-black text-emerald-300">تفعيل الحماية وتأكيد الدعوة</button>
            </div>
            <p id="message" class="text-sm text-slate-400" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const form = document.getElementById('setupForm');
        const message = document.getElementById('message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const token = new URLSearchParams(window.location.search).get('token') || '';
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (!token) { message.innerText = 'رابط الدعوة غير مكتمل.'; return; }
            if (password !== confirmPassword) { message.innerText = 'كلمتا المرور غير متطابقتين.'; return; }
            const response = await fetch('/api/auth/admin-invite/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
            const data = await response.json();
            if (!response.ok) { message.innerText = data.error || 'تعذر إعداد الحساب.'; return; }
            document.getElementById('qrCode').src = data.qrCode;
            document.getElementById('twoFactorStep').classList.remove('hidden');
            message.innerText = data.message || 'امسح الرمز ثم أدخل رمز المصادقة.';
            form.querySelector('button').disabled = true;
        });
        document.getElementById('confirmButton').addEventListener('click', async () => {
            const token = new URLSearchParams(window.location.search).get('token') || '';
            const code = document.getElementById('code').value.trim();
            const response = await fetch('/api/auth/admin-invite/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, code }) });
            const data = await response.json();
            message.innerText = data.message || data.error || 'تعذر تأكيد الدعوة.';
            if (response.ok) document.getElementById('confirmButton').disabled = true;
        });
    </script>
</body>
</html>
