<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="حالة خدمات OPERIX"><title>حالة المنصة | OPERIX</title><style>:root{color-scheme:dark;font-family:"IBM Plex Sans Arabic",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e5e7eb;line-height:1.9}main{max-width:760px;margin:auto;padding:28px 20px 64px}a{color:#f7b955;text-decoration:none}.brand{font:700 1.3rem Georgia,serif;letter-spacing:.08em}h1{color:#fff;margin-top:48px}.status{display:flex;justify-content:space-between;align-items:center;padding:18px;margin:14px 0;border:1px solid #203047;background:#0b1827;border-radius:16px}.status strong{color:#45d6b0}.dot{width:10px;height:10px;background:#45d6b0;border-radius:50%;box-shadow:0 0 0 6px rgba(69,214,176,.1)}.muted{color:#94a3b8;font-size:.84rem}</style></head><body><main><a class="brand" href="/">OPERIX</a><h1>حالة المنصة</h1><p class="muted">آخر فحص: <span id="checkedAt">جارٍ الفحص...</span></p><div class="status"><div><b>واجهة OPERIX</b><div class="muted">الوصول إلى الصفحة الرئيسية</div></div><span id="webStatus"><span class="dot"></span></span></div><div class="status"><div><b>واجهة API</b><div class="muted">الخدمات الأساسية</div></div><span id="apiStatus"><span class="dot"></span></span></div><p><a href="/help.html">مركز المساعدة</a> · <a href="/about.html">من نحن</a></p></main><script>const checkedAt=document.getElementById('checkedAt');const apiStatus=document.getElementById('apiStatus');const webStatus=document.getElementById('webStatus');checkedAt.textContent=new Date().toLocaleString('ar');fetch('/api/health').then(response=>{if(!response.ok)throw new Error();apiStatus.innerHTML='<strong>تعمل</strong>';}).catch(()=>{apiStatus.innerHTML='<strong style="color:#fb7185">تحتاج مراجعة</strong>';});webStatus.innerHTML='<strong>تعمل</strong>';</script></body></html>
