<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/operix-icon.svg">
<link rel="stylesheet" href="/dist/tailwind.css">
<title>دخول الإدارة | OPERIX</title>
<style>
body{font-family:"IBM Plex Sans Arabic",Arial,sans-serif;background:#07111f;background-image:linear-gradient(rgba(69,214,176,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(69,214,176,.035) 1px,transparent 1px);background-size:42px 42px}.panel{background:rgba(11,24,39,.9);border:1px solid rgba(247,185,85,.2);box-shadow:0 25px 80px rgba(0,0,0,.3)}input:focus{border-color:#f7b955;outline:none;box-shadow:0 0 0 3px rgba(247,185,85,.1)}






/* ===== Safe CSS-only motion layer for OPERIX ===== */
html{overflow-x:hidden}body{overflow-x:hidden;overscroll-behavior-x:none}
body::before{content:'';position:fixed;inset:-12%;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at 68% 12%, rgba(247,185,85,0.12), transparent 16%), radial-gradient(circle at 18% 78%, rgba(69,214,176,0.08), transparent 12%), radial-gradient(circle at 56% 96%, rgba(34,211,238,0.08), transparent 18%);background-size:130% 130%;background-position:center center;transform:scale(1.08);opacity:0.75}
@supports (animation-timeline: scroll()){body::before{animation:operixParallaxFloat linear both;animation-timeline:scroll(root block);animation-range:0% 100%}}
@supports (animation-timeline: view()){.company-intro{animation:operixHeroScaleFade 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 85%}.product-preview{animation:operixPreviewScale 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 82%}.intro-reveal,.intro-feature,.about-panel,.glass-card,.opx-market-card{animation:operixRevealFadeUp 850ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 78%}.intro-feature{animation-delay:80ms}.about-panel{animation-delay:150ms}.opx-market-card{animation-delay:120ms}}
@keyframes operixHeroScaleFade{from{opacity:0.78;transform:scale(0.985)}to{opacity:1;transform:scale(1)}}
@keyframes operixPreviewScale{from{opacity:0;transform:translateY(16px) scale(0.96);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes operixRevealFadeUp{from{opacity:0;transform:translateY(28px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes operixParallaxFloat{0%{transform:scale(1.08) translateY(-4%);opacity:0.65}50%{transform:scale(1.12) translateY(2%);opacity:0.75}100%{transform:scale(1.16) translateY(5%);opacity:0.82}}
@media (max-width: 640px){body{overflow-x:hidden}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 text-slate-100">
<div class="tech-grid-bg"><video class="tech-grid-bg-video" autoplay muted loop playsinline poster="https://images.unsplash.com/photo-1641897037078-e91a4afcce94?auto=format&q=80&w=1800"><source src="/arx.mp4" type="video/mp4"></video></div>
<main class="panel w-full max-w-md rounded-3xl p-7">
<div class="text-center mb-7"><img src="/operix-logo.svg" alt="OPERIX" class="h-12 w-auto mx-auto mb-5"><span class="text-[10px] text-emerald-300 tracking-widest">SECURE OPERATIONS ACCESS</span><h1 class="text-2xl font-black text-white mt-2">دخول لوحة الإدارة</h1><p class="text-xs text-slate-400 mt-2">مساحة منفصلة ومحمية لفريق OPERIX</p></div>
<form id="adminLoginForm" class="space-y-4">
<div><label class="block text-xs text-slate-400 mb-1">البريد الإداري</label><input id="adminEmail" type="email" required autocomplete="username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white"></div>
<div><label class="block text-xs text-slate-400 mb-1">كلمة المرور</label><input id="adminPassword" type="password" required autocomplete="current-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white"></div>
<div><label class="block text-xs text-slate-400 mb-1">رمز المصادقة الثنائية</label><input id="adminTwoFactorCode" type="text" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center tracking-[0.45em] text-lg text-white"><p class="text-[10px] text-slate-500 mt-1">أدخل الرمز الحالي من تطبيق Google Authenticator</p></div>
<p id="adminLoginError" class="hidden text-xs text-rose-300"></p><button id="adminLoginButton" class="w-full py-3.5 bg-amber-400 text-slate-950 rounded-xl text-sm font-black hover:bg-amber-300">الدخول الآمن</button>
</form>
<div class="mt-6 pt-5 border-t border-slate-800 text-center"><a href="/" class="text-xs text-slate-400 hover:text-amber-400">العودة إلى منصة OPERIX</a></div>
</main>
<script>
document.getElementById('adminLoginForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('adminLoginButton');const error=document.getElementById('adminLoginError');button.disabled=true;button.innerText='جارٍ التحقق...';error.classList.add('hidden');try{const response=await fetch('/api/auth/admin-login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('adminEmail').value,password:document.getElementById('adminPassword').value,twoFactorCode:document.getElementById('adminTwoFactorCode').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'بيانات الدخول غير صحيحة');localStorage.setItem('adminToken',data.token);window.location.href='/admin.html';}catch(e){error.innerText=e.message;error.classList.remove('hidden');}finally{button.disabled=false;button.innerText='الدخول الآمن';}});
</script>
</body>
</html>
