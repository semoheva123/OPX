<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/operix-icon.svg"><link rel="stylesheet" href="/dist/tailwind.css"><title>إعداد حماية الإدارة | OPERIX</title><style>body{font-family:"IBM Plex Sans Arabic",Arial,sans-serif;background:#07111f;background-image:linear-gradient(rgba(69,214,176,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(69,214,176,.035) 1px,transparent 1px);background-size:42px 42px}.panel{background:rgba(11,24,39,.92);border:1px solid rgba(247,185,85,.2);box-shadow:0 25px 80px rgba(0,0,0,.3)}





/* ===== Safe CSS-only motion layer for OPERIX ===== */
html{overflow-x:hidden}body{overflow-x:hidden;overscroll-behavior-x:none}
body::before{content:'';position:fixed;inset:-12%;z-index:-1;pointer-events:none;background-image:radial-gradient(circle at 68% 12%, rgba(247,185,85,0.12), transparent 16%), radial-gradient(circle at 18% 78%, rgba(69,214,176,0.08), transparent 12%), radial-gradient(circle at 56% 96%, rgba(34,211,238,0.08), transparent 18%);background-size:130% 130%;background-position:center center;transform:scale(1.08);opacity:0.75}
@supports (animation-timeline: scroll()){body::before{animation:operixParallaxFloat linear both;animation-timeline:scroll(root block);animation-range:0% 100%}}
@supports (animation-timeline: view()){.company-intro{animation:operixHeroScaleFade 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 85%}.product-preview{animation:operixPreviewScale 1000ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 82%}.intro-reveal,.intro-feature,.about-panel,.glass-card,.opx-market-card{animation:operixRevealFadeUp 850ms cubic-bezier(.22,1,.36,1) both;animation-timeline:view();animation-range:entry 0% cover 78%}.intro-feature{animation-delay:80ms}.about-panel{animation-delay:150ms}.opx-market-card{animation-delay:120ms}}
@keyframes operixHeroScaleFade{from{opacity:0.78;transform:scale(0.985)}to{opacity:1;transform:scale(1)}}
@keyframes operixPreviewScale{from{opacity:0;transform:translateY(16px) scale(0.96);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes operixRevealFadeUp{from{opacity:0;transform:translateY(28px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes operixParallaxFloat{0%{transform:scale(1.08) translateY(-4%);opacity:0.65}50%{transform:scale(1.12) translateY(2%);opacity:0.75}100%{transform:scale(1.16) translateY(5%);opacity:0.82}}
@media (max-width: 640px){body{overflow-x:hidden}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body class="min-h-screen flex items-center justify-center p-5 text-slate-100">
<div class="tech-grid-bg"></div><main class="panel w-full max-w-md rounded-3xl p-7"><div class="text-center mb-6"><img src="/operix-logo.svg" alt="OPERIX" class="h-11 w-auto mx-auto mb-4"><h1 class="text-xl font-black text-white">إعداد حماية الإدارة</h1><p class="text-xs text-slate-400 mt-2">فعّل Google Authenticator قبل أول دخول إداري</p></div><form id="setupForm" class="space-y-3"><input id="setupEmail" type="email" required placeholder="البريد الإداري" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white"><input id="setupPassword" type="password" required placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white"><button class="w-full py-3 bg-amber-400 text-slate-950 rounded-xl font-black text-sm">إنشاء رمز الحماية</button></form><div id="setupStep" class="hidden space-y-3 mt-5"><p class="text-xs text-slate-300 text-center">امسح رمز QR في Google Authenticator</p><div class="bg-white p-3 rounded-2xl w-fit mx-auto"><img id="setupQr" class="w-48 h-48" alt="رمز إعداد المصادقة"></div><p id="setupSecret" class="text-[10px] text-amber-300 text-center break-all"></p><form id="confirmForm" class="space-y-3"><input id="setupCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="رمز المصادقة المكوّن من 6 أرقام" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center tracking-[.4em] text-white"><button class="w-full py-3 bg-emerald-400 text-slate-950 rounded-xl font-black text-sm">تأكيد وتفعيل الحماية</button></form></div><p id="setupMessage" class="hidden text-xs text-center mt-4"></p><div class="text-center mt-6 pt-5 border-t border-slate-800"><a href="/admin-login.html" class="text-xs text-slate-400 hover:text-amber-400">العودة إلى دخول الإدارة</a></div></main><script>let credentials={};const message=document.getElementById('setupMessage');function showMessage(text,ok=false){message.textContent=text;message.className=`text-xs text-center mt-4 ${ok?'text-emerald-300':'text-rose-300'}`;}document.getElementById('setupForm').addEventListener('submit',async event=>{event.preventDefault();credentials={email:document.getElementById('setupEmail').value,password:document.getElementById('setupPassword').value};try{const response=await fetch('/api/auth/admin-2fa/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)});const data=await response.json();if(!response.ok)throw new Error(data.error);document.getElementById('setupQr').src=data.qrCode;document.getElementById('setupSecret').textContent=`المفتاح اليدوي: ${data.secret}`;document.getElementById('setupStep').classList.remove('hidden');showMessage(data.message,true);}catch(error){showMessage(error.message);}});document.getElementById('confirmForm').addEventListener('submit',async event=>{event.preventDefault();try{const response=await fetch('/api/auth/admin-2fa/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...credentials,code:document.getElementById('setupCode').value})});const data=await response.json();if(!response.ok)throw new Error(data.error);showMessage(data.message,true);setTimeout(()=>window.location.href='/admin-login.html',1000);}catch(error){showMessage(error.message);}});</script></body></html>
